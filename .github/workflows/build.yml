name: Build 3DSX

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: Make sure the 3DS libraries are present
        run: dkp-pacman -S --noconfirm --needed 3ds-dev
      - name: Build
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: homemenu
          path: homemenu.3dsx
